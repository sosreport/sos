name: Build Snap Package

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      for_release:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build-snap

      - name: Install snap
        run: |
          mv ${{ steps.build-snap.outputs.snap }} sos-build.snap
          [[ "$(dpkg -l sos)" ]] && sudo apt -y purge sos ubuntu-server
          [[ "$(dpkg -l sosreport)" ]] && sudo apt -y purge sosreport ubuntu-server
          sudo snap install --classic --dangerous sos-build.snap
          sudo snap alias sosreport.sos sos

      - name: Check snap works
        run: |
          sudo sos help

      - name: Upload snap Artifact
        if: ${{ !inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: sos-build.snap
          path: sos-build.snap
          retention-days: 1

      - name: Prepare Release Artifact
        if: ${{ inputs.for_release }}
        run: |
          mkdir release-assets
          cp sos-build.snap "release-assets/$(basename "${{ steps.build-snap.outputs.snap }}")"

      - name: Upload Release Artifact
        if: ${{ inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: release-snap
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

      - name: Post-Build Cleanup
        if: always()
        run: rm -rf ${{ steps.build-snap.outputs.snap }} release-assets
