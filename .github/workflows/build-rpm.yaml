name: Build RPM Package

on:
  workflow_call:
    inputs:
      distro_image:
        required: true
        type: string
      build:
        required: false
        type: string
        default: ''
      distro_name:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      for_release:
        required: false
        type: boolean
        default: false
      version_suffix:
        required: false
        type: string
        default: ''
jobs:
  build:
    runs-on: 'ubuntu-latest'

    container:
      image: ${{ inputs.distro_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        run: |
          dnf clean all
          dnf -y install rpm-build rpmdevtools gettext python3-devel python3-pexpect python3-pyyaml python3-setuptools
          dnf -y install python3-wheel || true
          dnf5 -y install 'dnf5-command(builddep)' || true

      - name: Set Version Suffix
        if: ${{ inputs.version_suffix != '' }}
        run: |
          sed -i -E 's/^(Release:\s*[0-9]+)/\1.${{ inputs.version_suffix }}/' sos.spec
          grep -F 'Release: 1.${{ inputs.version_suffix }}%{?dist}' sos.spec

      - name: Create RPM
        run: |
          rpmdev-setuptree
          python3 setup.py sdist
          mkdir -p /github/home/rpmbuild/SOURCES/
          cp dist/sos*.tar.gz /github/home/rpmbuild/SOURCES/
          dnf -y builddep sos.spec
          rpmbuild -ba sos.spec
          mv /github/home/rpmbuild/RPMS/noarch/sos-*.rpm sos-${{ inputs.distro_name }}.rpm

      - name: Upload Distro Artifact
        if: ${{ !inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: sos-${{ inputs.distro_name }}.rpm
          path: sos-${{ inputs.distro_name }}.rpm
          retention-days: 1

      - name: Prepare Release Artifact
        if: ${{ inputs.for_release }}
        run: |
          RPM=sos-${{ inputs.distro_name }}.rpm
          mkdir release-assets
          cp "$RPM" "release-assets/$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm' "$RPM")"

      - name: Upload Release Artifact
        if: ${{ inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.distro_name }}-rpm
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

      - name: Post-Build Cleanup
        if: always()
        run: rm -rf *.rpm release-assets
