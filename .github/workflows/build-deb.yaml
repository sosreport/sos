name: Build DEB Package

on:
  workflow_call:
    inputs:
      distro_image:
        required: true
        type: string
      distro_name:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      for_release:
        required: false
        type: boolean
        default: false
      version_suffix:
        required: false
        type: string
        default: ''
jobs:
  build:
    runs-on: ${{ inputs.distro_image == '' && inputs.distro_name || 'ubuntu-latest' }}

    container:
      image: ${{ inputs.distro_image != '' && inputs.distro_image || null }}
      options: ${{ inputs.distro_image != '' && '--privileged --tmpfs /tmp --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:ro' || '' }}

    steps:
      - name: Bootstrap Container system
        if: ${{ inputs.distro_image != '' }}
        run: |
          apt update
          apt -y install sudo

          CURRENT_USER=$(whoami)
          echo "Fixing sudo for user: $CURRENT_USER"

          echo "${CURRENT_USER} ALL=(ALL:ALL) NOPASSWD:ALL" > /etc/sudoers.d/gh-actions
          chmod 0440 /etc/sudoers.d/gh-actions

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: sos
          ref: ${{ inputs.ref }}

      - name: Install dependencies
        working-directory: ./sos
        run: |
          sudo apt update
          sudo apt -y install devscripts equivs
          sudo apt -y build-dep .

      - name: Set Version Suffix
        if: ${{ inputs.version_suffix != '' }}
        working-directory: ./sos
        env:
          DEBFULLNAME: No Reply
          DEBEMAIL: noreply@canonical.com
        run: |
          dch -v "$(dpkg-parsechangelog -S Version).${{ inputs.version_suffix }}" \
            -D unstable --force-distribution "Nightly build"

      - name: Create DEB Package
        working-directory: ./sos
        shell: bash
        run: |
          dpkg-buildpackage -b -us -uc -rfakeroot --build-by="No Reply <noreply@canonical.com>"
          mv ../*.deb ../sos-${{ inputs.distro_name }}.deb

      - name: Upload Distro Artifact
        if: ${{ !inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: sos-${{ inputs.distro_name }}.deb
          path: sos-${{ inputs.distro_name }}.deb
          retention-days: 1

      # Debs are named identically across distros, so the distro is added.
      # Use os-release rather than distro_name, which may be an alias such
      # as ubuntu-latest
      - name: Prepare Release Artifact
        if: ${{ inputs.for_release }}
        run: |
          DEB=sos-${{ inputs.distro_name }}.deb
          DEB_VERSION=$(dpkg-deb -f "$DEB" Version)
          DISTRO=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")
          mkdir release-assets
          cp "$DEB" "release-assets/$(dpkg-deb -f "$DEB" Package)_${DEB_VERSION#*:}_${DISTRO}_$(dpkg-deb -f "$DEB" Architecture).deb"

      - name: Upload Release Artifact
        if: ${{ inputs.for_release }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ inputs.distro_name }}-deb
          path: release-assets/
          retention-days: 1
          if-no-files-found: error

      - name: Post-Build Cleanup
        if: always()
        run: rm -rf *.deb release-assets
